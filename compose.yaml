# Compatible `docker compose` et `podman compose` / `podman-compose`.
# Images en nom complet (docker.io/...) pour que Podman n'ait pas à demander le registre.

services:
  db:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chinese}
      POSTGRES_USER: ${POSTGRES_USER:-chinese}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chinese}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./backend
    image: localhost/chinese-app:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-chinese}:${POSTGRES_PASSWORD:-chinese}@db:5432/${POSTGRES_DB:-chinese}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
