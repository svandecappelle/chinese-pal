# Tests de l'API à chaque push et pull request : les mêmes que `make test` (image de
# l'application + pytest, PostgreSQL de compose, base jetable chinese_test).
name: Tests

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Image de l'application
        run: docker compose build app

      - name: Image des tests
        run: docker compose --profile test build test

      - name: Tests de l'API
        run: docker compose --profile test run --rm test

      - name: Journal de PostgreSQL (en cas d'échec)
        if: failure()
        run: docker compose logs db

      - name: Arrêt
        if: always()
        run: docker compose --profile test down -v
